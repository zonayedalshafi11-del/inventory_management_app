<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="sidenav" aria-label="Main navigation">
    <div class="brand">
      <mat-icon aria-hidden="true">inventory</mat-icon>
      <span>InvenFlow</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        @if (canShow(item)) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active"
            [attr.aria-label]="item.label"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Inventory Management</span>
      <span class="spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="user-info" aria-live="polite">{{ user.name }} ({{ user.role }})</span>
      }
      <button mat-icon-button type="button" aria-label="Log out" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content" role="main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
