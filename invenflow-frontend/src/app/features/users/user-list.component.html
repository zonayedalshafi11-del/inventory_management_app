<div class="page-header">
  <h1>Users</h1>
  <button mat-flat-button color="primary" type="button" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add User
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search users</mat-label>
  <input matInput type="search" (input)="onSearch($any($event.target).value)" aria-label="Search users" />
</mat-form-field>

@if (loading()) {
  <p>Loading users...</p>
} @else {
  <table mat-table [dataSource]="filteredUsers()" aria-label="Users list">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let row">{{ row.role }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" aria-label="Edit user" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Delete user" (click)="deleteUser(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
