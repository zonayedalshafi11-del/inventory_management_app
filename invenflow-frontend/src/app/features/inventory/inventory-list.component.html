<div class="page-header">
  <h1>Inventory</h1>
  <button mat-flat-button color="primary" type="button" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Inventory
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search inventory</mat-label>
  <input matInput type="search" (input)="onSearch($any($event.target).value)" aria-label="Search inventory" />
</mat-form-field>

@if (loading()) {
  <p>Loading inventory...</p>
} @else {
  <table mat-table [dataSource]="filteredInventory()" aria-label="Inventory list">
    <ng-container matColumnDef="productName">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let row">{{ row.productName }}</td>
    </ng-container>
    <ng-container matColumnDef="warehouseName">
      <th mat-header-cell *matHeaderCellDef>Warehouse</th>
      <td mat-cell *matCellDef="let row">{{ row.warehouseName }}</td>
    </ng-container>
    <ng-container matColumnDef="totalQuantity">
      <th mat-header-cell *matHeaderCellDef>Quantity</th>
      <td mat-cell *matCellDef="let row">{{ row.totalQuantity }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" aria-label="Edit inventory" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Delete inventory" (click)="deleteItem(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
