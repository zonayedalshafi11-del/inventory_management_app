<div class="page-header">
  <h1>Customers</h1>
  <button mat-flat-button color="primary" type="button" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Customer
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search customers</mat-label>
  <input matInput type="search" (input)="onSearch($any($event.target).value)" aria-label="Search customers" />
</mat-form-field>

@if (loading()) {
  <p>Loading customers...</p>
} @else {
  <table mat-table [dataSource]="filteredCustomers()" aria-label="Customers list">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" aria-label="Edit customer" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Delete customer" (click)="deleteCustomer(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
