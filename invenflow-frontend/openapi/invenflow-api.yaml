components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4
    UserPermissions:
      type: object
      properties:
        manageProducts: { type: boolean }
        manageOrders: { type: boolean }
        viewReports: { type: boolean }
        manageUsers: { type: boolean }
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        lastLogin: { type: string }
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        token: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { type: string }
        status: { type: string }
        lastLogin: { type: string }
        manageProducts: { type: boolean }
        manageOrders: { type: boolean }
        viewReports: { type: boolean }
        manageUsers: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sku: { type: string }
        category: { type: string }
        costPrice: { type: number, format: double }
        sellPrice: { type: number, format: double }
        stock: { type: integer }
        reorderLevel: { type: integer }
        status: { type: string }
        supplier: { type: string }
    Customer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
    Supplier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contactEmail: { type: string }
        phone: { type: string }
    Warehouse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        location: { type: string }
    Inventory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        warehouseId: { type: integer, format: int64 }
        warehouseName: { type: string }
        totalQuantity: { type: integer }
    PurchaseOrderItem:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer }
        price: { type: number, format: double }
    PurchaseOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        supplier: { type: string }
        orderDate: { type: string, format: date }
        expectedDelivery: { type: string, format: date }
        totalAmount: { type: number, format: double }
        status: { type: string, enum: [Pending, RECEIVED] }
        invoiceAttachment: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
    SalesOrderItem:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer }
        price: { type: number, format: double }
    SalesOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerName: { type: string }
        orderDate: { type: string, format: date }
        totalAmount: { type: number, format: double }
        status: { type: string, enum: [COMPLETED, CANCELLED, REFUNDED] }
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItem'
    CreatePaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, format: double }
        method: { type: string, enum: [CASH, CARD, TRANSFER] }
        purchaseOrderId: { type: integer, format: int64 }
        salesOrderId: { type: integer, format: int64 }
    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        amount: { type: number, format: double }
        method: { type: string }
        paymentDate: { type: string }
        type: { type: string, enum: [PURCHASE, SALES] }
        purchaseOrderId: { type: integer, format: int64 }
        salesOrderId: { type: integer, format: int64 }
        supplier: { type: string }
        customerName: { type: string }
        products:
          type: array
          items: { type: string }
    StockSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sku: { type: string }
        category: { type: string }
        currentStock: { type: integer }
        reorderLevel: { type: integer }
        supplier: { type: string }
        stockStatus: { type: string }
    StockTransaction:
      type: object
      properties:
        type: { type: string, enum: [IN, OUT] }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer }
        reference: { type: string }
        counterparty: { type: string }
        date: { type: string }
    ApiError:
      type: object
      properties:
        error: { type: string }
